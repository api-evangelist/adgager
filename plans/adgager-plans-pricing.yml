metering:
  model: >-
    Research projects are additionally metered in platform credit, separate from the subscription.
    The schema exposes BrandCredit, BrandCreditTransaction, createBrandCredit and spendBrandCredit,
    and a projectCost query prices a project before it is created. A second internal unit, "gag"
    (the GAG token), meters Gager-side rewards - Project.gag, GagTransaction, GagExchange,
    gagerCurrentBalance.
  source: graphql/adgager.graphql
self_service_signup:
  api_plans_published: false
  note: >-
    None of these plans is an API plan. There is no developer tier, no per-call pricing and no
    published API key purchase path - the GraphQL API is the private backend of the dashboard the
    plans buy.
purchase_flow:
  provider: iyzico
  evidence: >-
    The WordPress storefront on www.adgager.com exposes an iyzico/v1 REST namespace, and the
    GraphQL schema carries saveCreditCard, setDefaultCreditCard, initSubscriptionWithPayment and a
    Transaction type.
