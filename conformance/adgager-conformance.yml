domain_standard:
  market: market research / consumer insights / advertising effectiveness measurement
  standards_checked:
  - id: esomar
    body: ESOMAR / ICC-ESOMAR International Code
    declared_in_contract: false
    evidence: >-
      No ESOMAR reference in the schema, in either llms.txt, or on any indexed page. Membership is
      an organisational claim rather than a contract signature, and none is published.
  - id: triple-s
    body: Triple-S (survey data interchange XML)
    declared_in_contract: false
    evidence: >-
      No Triple-S export surface. Survey definitions are carried in a bespoke `SurveyJsScalar`
      (SurveyJS JSON), and answers in a bespoke JSONScalar, neither of which is an interchange standard.
  - id: ddi
    body: DDI (Data Documentation Initiative)
    declared_in_contract: false
    evidence: No DDI codebook or metadata surface in the schema.
  - id: openrtb
    body: IAB OpenRTB
    declared_in_contract: false
    evidence: >-
      Checked because AdQ is an advertising product, but Adgager measures ad effectiveness rather
      than transacting inventory - no bid request, imp, seatbid or auction shape exists in the schema.
  - id: vast
    body: IAB VAST
    declared_in_contract: false
    evidence: No ad-serving or video-ad-delivery surface; ad films are uploaded assets, not VAST tags.
  conclusion: >-
    Adgager's market has candidate standards (Triple-S, DDI for survey data interchange) and the
    contract signs none of them. Survey definitions and answers move as vendor-specific JSON
    scalars, so a buyer already speaking a survey-data standard needs a bespoke connector. This is
    recorded as a finding, not a penalty - the reward-only rule applies.
regulatory:
  jurisdiction: Türkiye
  regimes_named_by_provider:
  - name: KVKK (Turkish Personal Data Protection Law No. 6698)
    evidence: >-
      The site publishes an "Aydınlatma Metni" (KVKK illumination/disclosure text) at
      https://www.adgager.com/aydinlatma-metni/ and https://www.adgager.com/en/illumination-text/,
      which is the KVKK-mandated data-subject notice. HTTP 200, 2026-09-07.
    certification: none published
  certifications_published: []
  note: >-
    The platform holds identity-grade personal data - the schema exposes checkTcknVni, which
    validates a Turkish national identity number (TCKN) or tax number (VKN), plus BankInformation
    and demographic SES data - and publishes no SOC 2, ISO 27001 or equivalent attestation.
