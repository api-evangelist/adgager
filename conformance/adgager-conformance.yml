api: adgager-graphql
conformance:
- id: graphql-over-http
  conforms: true
  evidence: >-
    POST application/json with a `query` member to https://api.adgager.com/graphql returns a
    spec-shaped {data, errors} envelope; HTTP 200 is used for application errors. Observed 2026-09-07.
- id: graphql-introspection
  conforms: true
  evidence: >-
    The full October 2021 introspection query returns a complete __schema (414 types) to an
    anonymous caller. Observed 2026-09-07.
- id: graphql-multipart-request-spec
  conforms: true
  evidence: >-
    `scalar Upload` in the schema names https://github.com/jaydenseric/graphql-multipart-request-spec
    in its own description; uploadFile, uploadAvatar, createProjectImage and createBrandImage consume it.
- id: graphql-deprecation-directive
  conforms: false
  evidence: >-
    @deprecated is available and used on zero of the schema's fields and enum values, so the schema
    carries no in-band evolution signal.
- id: relay-cursor-connections
  conforms: false
  evidence: >-
    Pagination is Laravel Lighthouse offset paging (first/page + PaginatorInfo), not Relay
    connections - there is no edges/node/pageInfo/cursor shape anywhere in the schema.
- id: oauth2
  conforms: false
  evidence: >-
    No oauth2 flow. Authentication is a Laravel Sanctum bearer token; /.well-known/oauth-authorization-server
