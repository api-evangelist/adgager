apis:
- aid: adgager:adgager-graphql
  name: Adgager GraphQL API
  description: The single first-party API behind the Adgager platform and the dash.adgager.com client
    dashboard. A Laravel Lighthouse GraphQL endpoint exposing 118 queries and 141 mutations over the platform's
    core domain - brands and sub-brands, research projects, question groups, target filters and target
    groups, project answers and scores, the AdQ advertising-effectiveness score and comparisons, the Gager
    member community (registration, invites, Gentry social feed, wallet and GAG token transactions, payment
    requests), subscriptions and plans, campaigns, events and reference data. Introspection is open and
    unauthenticated; reference-data queries (countries, cities, plans, languages, sectors, universities)
    answer anonymously, while everything account-scoped is behind the Laravel Sanctum bearer guard.
  humanURL: https://dash.adgager.com/
  baseURL: https://api.adgager.com/graphql
