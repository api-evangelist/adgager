aid: adgager
name: Adgager
description: Adgager is an Istanbul-based market research platform founded in 2016 with support from Istanbul
  Technical University (ITU). It runs end-to-end research studies for brands over a verified member community
  ("Gagers"), combining survey, mobile-community (ADTEAMS), neuroscience and ethnographic methods with
  an AI-assisted analysis stack. Its AdQ product scores advertising effectiveness across traditional and
  digital channels and benchmarks a brand against category, competitor and market averages. Clients run
  projects, target groups, question groups and reports through the dashboard at dash.adgager.com, which
  is backed by a single first-party GraphQL API at api.adgager.com/graphql (Laravel Lighthouse, Sanctum
  bearer auth). Adgager reports serving 200+ brands including L'Oreal, Nestle, Bioderma, ING Bank, Reckitt
  Benckiser and Oriflame.
